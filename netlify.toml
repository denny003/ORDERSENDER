[build]
  publish = "site"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/offerta"
  to = "/offerta.html"
  status = 200

[[redirects]]
  from = "/configurazione"
  to = "/configurazione.html"
  status = 200

[[redirects]]
  from = "/gestione-ordini"
  to = "/gestione-ordini.html"
  status = 200

[[redirects]]
  from = "/giro-visite"
  to = "/giro-visite.html"
  status = 200

[[redirects]]
  from = "/pianificazione-produzione"
  to = "/pianificazione-produzione.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"

