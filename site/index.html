<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offerte Agenti</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><style>
body{background:#f3f6f8;color:#10283d}.shell{max-width:1100px;margin:auto;padding:24px}.top{background:#0b2942;color:white;padding:18px 24px}.top>div{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px}.logo{background:white;color:#123b5d;border-radius:12px;padding:12px;font-weight:900}.card{background:white;border:1px solid #bdc9d2;border-radius:18px;padding:22px;margin-top:24px}.actions{display:flex;flex-wrap:wrap;gap:12px}.btn{display:inline-flex;text-decoration:none}.login{max-width:430px;margin:70px auto}.login input{width:100%;box-sizing:border-box;margin:7px 0 14px;padding:12px;border:1px solid #bac7d0;border-radius:9px}.error{color:#a11}.hidden{display:none}.rows{display:grid;gap:10px;margin-top:15px}.row{border:1px solid #d5dde3;border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:15px}
</style></head><body><header class="top"><div><span class="logo">OA</span><div><strong>Offerte Agenti</strong><small style="display:block;color:#bce3ff">Pilota Netlify</small></div><button id="logout" class="btn secondary hidden" style="margin-left:auto">Esci</button></div></header><main class="shell"><section id="login" class="card login"><h1>Accesso agenti</h1><p>Inserisci le credenziali assegnate dall’amministrazione.</p><form id="loginForm"><label>Utente<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Accedi</button><p id="loginError" class="error"></p></form></section><section id="app" class="hidden"><div class="card"><h1>Offerte e ordini</h1><p id="welcome"></p><div class="actions"><a class="btn primary" href="/offerta?new=1&type=offer">Nuova offerta</a><a class="btn primary" href="/offerta?new=1&type=order">Nuovo ordine</a><button class="btn secondary" id="refresh">Aggiorna pratiche</button></div></div><div class="card"><h2>Pratiche recenti</h2><div id="rows" class="rows">Caricamento…</div></div></section></main><script>
const $=x=>document.getElementById(x);async function api(path,opt={}){const r=await fetch('/api/'+path,{...opt,headers:{accept:'application/json','content-type':'application/json',...(opt.headers||{})}}),text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{}if(!r.ok)throw new Error(d.error||'Operazione non riuscita');return d}async function load(){try{const me=await api('session');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('welcome').textContent='Accesso: '+me.user.name;const [a,b]=await Promise.all([api('offers'),api('orders')]);const rows=[...(a.offers||[]).map(x=>({...x,type:'Offerta',number:x.offer_number||x.offerNumber})),...(b.orders||[]).map(x=>({...x,type:'Ordine',number:x.order_number||x.orderNumber}))].sort((x,y)=>String(y.updated_at||y.submitted_at||'').localeCompare(String(x.updated_at||x.submitted_at||''))).slice(0,100);$('rows').innerHTML=rows.length?rows.map(x=>`<div class="row"><span><strong>${x.type} ${x.number||''}</strong><small style="display:block">${x.customer_name||x.customerName||''}</small></span><b>${Number(x.total||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'})}</b></div>`).join(''):'Nessuna pratica presente'}catch{$('login').classList.remove('hidden');$('app').classList.add('hidden')}}$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});location.reload()}catch(err){$('loginError').textContent=err.message}};$('logout').onclick=async()=>{await api('logout',{method:'POST',body:'{}'});location.reload()};$('refresh').onclick=load;load();
</script></body></html>
